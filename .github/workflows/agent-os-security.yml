name: agent-os security gate

on:
  pull_request:
    paths:
      - "agent-os/**"
      - "scripts/verify-all.mjs"
      - ".github/workflows/agent-os-security.yml"
  push:
    branches: [main]
    paths:
      - "agent-os/**"
      - "scripts/verify-all.mjs"
      - ".github/workflows/agent-os-security.yml"

concurrency:
  group: agent-os-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check agent-os/server.js
      - run: node --test agent-os/*.test.js
