name: 찬양팀·회계 저장 계약
on:
  pull_request:
    paths:
      - "highschool-app/src/features/finance/**"
      - "highschool-app/src/app/api/finance/**"
      - "highschool-app/src/features/portal/accessPolicy.ts"
      - "highschool-app/src/features/praise/**"
      - "highschool-app/src/app/api/praise/**"
      - "highschool-app/package*.json"
      - "attendance-app/database.rules.json"
      - "scripts/run-praise-contracts.mjs"
      - ".github/workflows/praise-contracts.yml"
  push:
    branches: [main]
    paths:
      - "highschool-app/src/features/finance/**"
      - "highschool-app/src/app/api/finance/**"
      - "highschool-app/src/features/portal/accessPolicy.ts"
      - "highschool-app/src/features/praise/**"
      - "highschool-app/src/app/api/praise/**"
      - "highschool-app/package*.json"
      - "attendance-app/database.rules.json"
      - "scripts/run-praise-contracts.mjs"
      - ".github/workflows/praise-contracts.yml"
permissions:
  contents: read
jobs:
  praise-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highschool-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix highschool-app
      - run: npm install --global firebase-tools@15.10.0
      - run: node scripts/run-praise-contracts.mjs
      - run: node scripts/run-praise-contracts.mjs --finance
