name: highschool-app quality gate

on:
  pull_request:
    paths:
      - "highschool-app/**"
      - ".github/workflows/highschool-quality.yml"
  push:
    branches: [main]
    paths:
      - "highschool-app/**"
      - ".github/workflows/highschool-quality.yml"
  workflow_dispatch:

concurrency:
  group: highschool-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time only Firebase shape. The verification job never connects to
      # production; authenticated E2E runs separately against the deployed app.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY1
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-project.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://ci-project-default-rtdb.firebaseio.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
    defaults:
      run:
        working-directory: highschool-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highschool-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/check-praise-runtime.mjs
      - run: npm run quality:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: highschool-quality-reports
          path: |
            highschool-app/coverage
            highschool-app/.lighthouseci
          if-no-files-found: ignore

  # 운영 인증 상태는 PR 코드에 제공하지 않는다. 수동 main 실행은 기존 인증 가드를 유지한다.
  authenticated-e2e:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: highschool-app
    env:
      E2E_STORAGE_STATE: .auth/user.json
      E2E_BASE_URL: https://woorihigh-app.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highschool-app/package-lock.json
      - run: npm ci
      - name: Restore authenticated browser state
        env:
          E2E_STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
        run: |
          mkdir -p .auth
          printf '%s' "$E2E_STORAGE_STATE_B64" | base64 --decode > .auth/user.json
      - name: Verify deployed commit
        env:
          E2E_EXPECTED_BUILD_ID: ${{ github.sha }}
        run: node scripts/wait-for-e2e-build.mjs
      - run: node scripts/require-e2e-auth.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: highschool-playwright-report
          path: highschool-app/test-results
          if-no-files-found: ignore

  production-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect highschool app changes
        id: app_changes
        run: |
          if git diff --quiet HEAD^ HEAD -- highschool-app; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.app_changes.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Verify deployed commit without authentication
        if: steps.app_changes.outputs.changed == 'true'
        env:
          E2E_BASE_URL: https://woorihigh-app.vercel.app
          E2E_EXPECTED_BUILD_ID: ${{ github.sha }}
        run: node highschool-app/scripts/wait-for-e2e-build.mjs
