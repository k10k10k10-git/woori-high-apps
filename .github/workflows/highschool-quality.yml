name: highschool-app quality gate

on:
  pull_request:
    paths:
      - "highschool-app/**"
      - ".github/workflows/highschool-quality.yml"
  push:
    branches: [main]
    paths:
      - "highschool-app/**"
      - ".github/workflows/highschool-quality.yml"
  workflow_dispatch:

concurrency:
  group: highschool-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highschool-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highschool-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run quality:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highschool-quality-reports
          path: |
            highschool-app/coverage
            highschool-app/.lighthouseci
          if-no-files-found: ignore

  authenticated-e2e:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: highschool-app
    env:
      E2E_STORAGE_STATE: .auth/user.json
      E2E_BASE_URL: https://woorihigh-app.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: highschool-app/package-lock.json
      - run: npm ci
      - name: Restore authenticated browser state
        env:
          E2E_STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
        run: |
          mkdir -p .auth
          printf '%s' "$E2E_STORAGE_STATE_B64" | base64 --decode > .auth/user.json
      - run: node scripts/require-e2e-auth.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: highschool-playwright-report
          path: highschool-app/test-results
          if-no-files-found: ignore
