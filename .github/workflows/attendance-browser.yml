name: 출석부 격리 인증 업무 검사
on:
  pull_request:
    paths: ['attendance-app/**', 'scripts/run-attendance-browser.mjs', '.github/workflows/attendance-browser.yml', 'highschool-app/package*.json']
  push:
    branches: [main]
    paths: ['attendance-app/**', 'scripts/run-attendance-browser.mjs', '.github/workflows/attendance-browser.yml', 'highschool-app/package*.json']
permissions:
  contents: read
jobs:
  authenticated-workflow:
    runs-on: ubuntu-latest
    # 2026-11-12 Supabase 이관 뒤 이 하네스(attendance-app/e2e)는 아직 Firebase 에뮬레이터에 묶여 있어 끝나지 않는다.
    # 새 플랫폼용으로 다시 짤 때까지 실행 시간을 묶어 Actions 시간을 지킨다(성공한 실행은 20~25분).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            attendance-app/package-lock.json
            highschool-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix attendance-app
      - run: npm ci --prefix highschool-app
      - run: npm install --global firebase-tools@15.10.0
      - run: node highschool-app/node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - run: node scripts/run-attendance-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-attendance-browser-results
          path: tmp/attendance-browser-results
          retention-days: 3
