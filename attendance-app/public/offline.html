<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6355a7">
  <title>인터넷 연결 확인 · 출석부</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7f9; color: #292933; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 480px; margin: 12vh auto; padding: 28px; }
    h1 { font-size: 24px; line-height: 1.4; margin: 0 0 16px; }
    p { margin: 0 0 20px; color: #555563; overflow-wrap: anywhere; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 10px 18px; border-radius: 12px; background: #6355a7; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #292933; outline-offset: 4px; }
  </style>
</head>
<body><main><h1>인터넷 연결이 필요합니다</h1>
  <p>출석부를 열지 못했습니다. 인터넷에 연결한 뒤 다시 열어 주세요. 이 화면에서는 출석을 조회하거나 저장할 수 없습니다.</p>
  <a href="/">출석부 다시 열기</a>
</main></body>
</html>
