<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 OS — 통합 플랫폼 운영</title>
<script src="/app.js"></script>
<style>
  :root {
    --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --accent:#0ea5e9; --green:#dcfce7; --green-ink:#166534; --red:#fee2e2; --red-ink:#991b1b;
    --amber:#fef3c7; --amber-ink:#92400e; --violet:#ede9fe; --violet-ink:#5b21b6;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:17px; }
  header .dday { margin-left:auto; background:var(--violet); color:var(--violet-ink); border-radius:999px; padding:4px 14px; font-size:13px; font-weight:700; }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; padding:8px 14px; border-radius:8px; font-size:14px; color:var(--sub); cursor:pointer; font-weight:600; }
  nav button.on { background:#e0f2fe; color:#0369a1; }
  main { max-width:1060px; margin:0 auto; padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h3 { font-size:12px; color:var(--sub); font-weight:700; margin-bottom:10px; letter-spacing:.02em; }
  .big { font-size:30px; font-weight:800; }
  .sub { font-size:12px; color:var(--sub); margin-top:4px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; gap:8px; }
  .row:last-child { border-bottom:0; }
  .row .h { font-family:ui-monospace,monospace; font-size:11px; color:var(--sub); flex-shrink:0; }
  .pill { border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; flex-shrink:0; }
  .pill.ok { background:var(--green); color:var(--green-ink); }
  .pill.err { background:var(--red); color:var(--red-ink); }
  .pill.run { background:var(--amber); color:var(--amber-ink); }
  .wide { grid-column:1/-1; }
  section { display:none; } section.on { display:block; }
  .domain { margin-bottom:26px; }
  .domain h2 { font-size:14px; color:var(--sub); margin-bottom:12px; }
  .skills { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .skill { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; text-align:left; transition:box-shadow .15s, transform .15s; }
  .skill:hover { box-shadow:0 4px 16px rgba(2,132,199,.10); transform:translateY(-1px); }
  .skill b { display:block; font-size:14px; margin-bottom:4px; }
  .skill span { font-size:12px; color:var(--sub); }
  .skill .tag { float:right; font-size:10px; background:var(--red); color:var(--red-ink); border-radius:6px; padding:2px 6px; font-weight:700; }
  .skill:disabled { opacity:.5; cursor:wait; }
  #console { background:#0f172a; color:#e2e8f0; border-radius:14px; padding:16px; font-family:ui-monospace,monospace; font-size:12px; line-height:1.7; max-height:420px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; display:none; margin-bottom:22px; }
  #console .tool { color:#7dd3fc; }
  #console .txt { color:#e2e8f0; }
  #console .hdr { color:#a5b4fc; font-weight:700; }
  .log { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .log .top { display:flex; gap:10px; align-items:center; font-size:14px; }
  .log .top b { flex:1; }
  .log .when { font-size:12px; color:var(--sub); }
  .log .detail { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:12px; font-size:13px; }
  .log.open .detail { display:block; }
  .log .detail pre { background:#f1f5f9; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:300px; overflow-y:auto; }
  .empty { color:var(--sub); font-size:13px; padding:20px; text-align:center; }
  .hint { font-size:12px; color:var(--sub); background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:10px 14px; margin-top:20px; }
</style>
</head>
<body>
<header>
  <h1>🧭 에이전트 OS</h1>
  <nav>
    <button data-tab="home" class="on">홈</button>
    <button data-tab="skills">스킬</button>
    <button data-tab="logs">로그</button>
  </nav>
  <div class="dday" id="dday"></div>
</header>
<main>

<section id="home" class="on">
  <div class="grid" id="report"><div class="empty">보고서를 불러오는 중…</div></div>
</section>

<section id="skills">
  <div id="console"></div>
  <div id="skillList"></div>
  <div class="hint">➕ 버튼 추가는 <b>agent-os/skills.json</b>에 항목 5줄을 넣으면 끝 — 새로고침하면 나타납니다. (id / domain / label / desc / prompt)</div>
</section>

<section id="logs">
  <div id="logList"><div class="empty">불러오는 중…</div></div>
</section>

</main>
</body>
</html>
