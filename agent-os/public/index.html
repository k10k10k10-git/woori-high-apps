<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 OS — 수련회 운영</title>
<style>
  :root {
    --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --accent:#0ea5e9; --green:#dcfce7; --green-ink:#166534; --red:#fee2e2; --red-ink:#991b1b;
    --amber:#fef3c7; --amber-ink:#92400e; --violet:#ede9fe; --violet-ink:#5b21b6;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:17px; }
  header .dday { margin-left:auto; background:var(--violet); color:var(--violet-ink); border-radius:999px; padding:4px 14px; font-size:13px; font-weight:700; }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; padding:8px 14px; border-radius:8px; font-size:14px; color:var(--sub); cursor:pointer; font-weight:600; }
  nav button.on { background:#e0f2fe; color:#0369a1; }
  main { max-width:1060px; margin:0 auto; padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h3 { font-size:12px; color:var(--sub); font-weight:700; margin-bottom:10px; letter-spacing:.02em; }
  .big { font-size:30px; font-weight:800; }
  .sub { font-size:12px; color:var(--sub); margin-top:4px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; gap:8px; }
  .row:last-child { border-bottom:0; }
  .row .h { font-family:ui-monospace,monospace; font-size:11px; color:var(--sub); flex-shrink:0; }
  .pill { border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; flex-shrink:0; }
  .pill.ok { background:var(--green); color:var(--green-ink); }
  .pill.err { background:var(--red); color:var(--red-ink); }
  .pill.run { background:var(--amber); color:var(--amber-ink); }
  .wide { grid-column:1/-1; }
  section { display:none; } section.on { display:block; }
  .domain { margin-bottom:26px; }
  .domain h2 { font-size:14px; color:var(--sub); margin-bottom:12px; }
  .skills { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .skill { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; text-align:left; transition:box-shadow .15s, transform .15s; }
  .skill:hover { box-shadow:0 4px 16px rgba(2,132,199,.10); transform:translateY(-1px); }
  .skill b { display:block; font-size:14px; margin-bottom:4px; }
  .skill span { font-size:12px; color:var(--sub); }
  .skill .tag { float:right; font-size:10px; background:var(--red); color:var(--red-ink); border-radius:6px; padding:2px 6px; font-weight:700; }
  .skill:disabled { opacity:.5; cursor:wait; }
  #console { background:#0f172a; color:#e2e8f0; border-radius:14px; padding:16px; font-family:ui-monospace,monospace; font-size:12px; line-height:1.7; max-height:420px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; display:none; margin-bottom:22px; }
  #console .tool { color:#7dd3fc; }
  #console .txt { color:#e2e8f0; }
  #console .hdr { color:#a5b4fc; font-weight:700; }
  .log { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .log .top { display:flex; gap:10px; align-items:center; font-size:14px; }
  .log .top b { flex:1; }
  .log .when { font-size:12px; color:var(--sub); }
  .log .detail { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:12px; font-size:13px; }
  .log.open .detail { display:block; }
  .log .detail pre { background:#f1f5f9; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:300px; overflow-y:auto; }
  .empty { color:var(--sub); font-size:13px; padding:20px; text-align:center; }
  .hint { font-size:12px; color:var(--sub); background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:10px 14px; margin-top:20px; }
</style>
</head>
<body>
<header>
  <h1>🧭 에이전트 OS</h1>
  <nav>
    <button data-tab="home" class="on">홈</button>
    <button data-tab="skills">스킬</button>
    <button data-tab="logs">로그</button>
  </nav>
  <div class="dday" id="dday"></div>
</header>
<main>

<section id="home" class="on">
  <div class="grid" id="report"><div class="empty">보고서를 불러오는 중…</div></div>
</section>

<section id="skills">
  <div id="console"></div>
  <div id="skillList"></div>
  <div class="hint">➕ 버튼 추가는 <b>agent-os/skills.json</b>에 항목 5줄을 넣으면 끝 — 새로고침하면 나타납니다. (id / domain / label / desc / prompt)</div>
</section>

<section id="logs">
  <div id="logList"><div class="empty">불러오는 중…</div></div>
</section>

</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (ts) => new Date(ts).toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
const esc = (s) => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const statusPill = (s) => s==="done" ? '<span class="pill ok">완료</span>' : s==="running" ? '<span class="pill run">실행 중</span>' : '<span class="pill err">오류</span>';

// ── 탭 ──
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x===b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id===b.dataset.tab));
  if (b.dataset.tab==="logs") loadLogs();
  if (b.dataset.tab==="home") loadReport();
});

// ── 홈: 일일 보고서 ──
async function loadReport() {
  const r = await (await fetch("/api/report")).json();
  if (r.dday) $("#dday").textContent = `${r.dday.label} D${r.dday.days>0?"-"+r.dday.days:r.dday.days===0?"-DAY":"+"+(-r.dday.days)}`;
  const dep = (name) => {
    const d = r.deployments[name];
    if (!d) return `<div class="row"><span>${name}</span><span class="pill err">확인 불가</span></div>`;
    const cls = d.state==="READY" ? "ok" : d.state==="ERROR" ? "err" : "run";
    return `<div class="row"><span>${name} <span class="h">${d.sha}</span></span><span class="pill ${cls}">${d.state}</span></div>`;
  };
  const commits = (list) => list.length
    ? list.map(c=>`<div class="row"><span>${esc(c.msg.slice(0,42))}</span><span class="h">${c.hash}</span></div>`).join("")
    : '<div class="empty">커밋 없음</div>';
  const runsRows = (list) => list.length
    ? list.map(x=>`<div class="row"><span>${esc(x.label)}</span>${statusPill(x.status)}</div>`).join("")
    : '<div class="empty">실행 이력 없음</div>';
  $("#report").innerHTML = `
    <div class="card"><h3>이번 주 커밋</h3><div class="big">${r.commitsWeek}</div><div class="sub">오늘 ${r.commitsToday.length} · 어제 ${r.commitsYesterday.length}</div></div>
    <div class="card"><h3>이번 주 Claude 세션</h3><div class="big">${r.sessionsWeek}</div><div class="sub">최근 7일</div></div>
    <div class="card"><h3>미해결 백로그</h3><div class="big">${r.backlog.length}</div><div class="sub">메모리 기준</div></div>
    <div class="card"><h3>배포 상태</h3>${dep("highschool-app")}${dep("semester-app")}</div>
    <div class="card wide"><h3>오늘의 커밋</h3>${commits(r.commitsToday)}</div>
    <div class="card wide"><h3>어제의 커밋</h3>${commits(r.commitsYesterday)}</div>
    <div class="card"><h3>밤새 실행된 항목</h3>${runsRows(r.overnight)}</div>
    <div class="card"><h3>최근 실행</h3>${runsRows(r.recentRuns)}</div>
    <div class="card wide"><h3>열려 있는 작업 (백로그)</h3>${r.backlog.map(b=>`<div class="row"><span>${esc(b)}</span></div>`).join("")||'<div class="empty">없음</div>'}</div>`;
}

// ── 스킬 버튼 ──
let running = false;
async function loadSkills() {
  const cfg = await (await fetch("/api/skills")).json();
  const byDomain = {};
  cfg.skills.forEach(s => (byDomain[s.domain] = byDomain[s.domain]||[]).push(s));
  $("#skillList").innerHTML = Object.entries(byDomain).map(([d, list]) => `
    <div class="domain"><h2>${d}</h2><div class="skills">
      ${list.map(s=>`<button class="skill" data-id="${s.id}" data-danger="${!!s.danger}">
        ${s.danger?'<span class="tag">배포</span>':""}<b>${esc(s.label)}</b><span>${esc(s.desc)}</span></button>`).join("")}
    </div></div>`).join("");
  document.querySelectorAll(".skill").forEach(b => b.onclick = () => runSkill(b));
}
async function runSkill(btn) {
  if (running) return alert("이미 실행 중입니다 — 완료 후 다시 시도하세요.");
  if (btn.dataset.danger==="true" && !confirm("커밋·푸시·배포가 실행됩니다. 진행할까요?")) return;
  running = true;
  document.querySelectorAll(".skill").forEach(b=>b.disabled=true);
  const con = $("#console");
  con.style.display = "block";
  con.innerHTML = `<div class="hdr">▶ ${btn.querySelector("b").textContent} — 실행 시작 ${new Date().toLocaleTimeString("ko-KR")}</div>`;
  const add = (cls, text) => { const d=document.createElement("div"); d.className=cls; d.textContent=text; con.appendChild(d); con.scrollTop=con.scrollHeight; };
  try {
    const res = await fetch("/api/run", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ skillId: btn.dataset.id }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i+2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type==="tool") add("tool", "🔧 " + ev.data);
        else if (ev.type==="text") add("txt", ev.data);
        else if (ev.type==="end") add("hdr", `■ ${ev.data.status==="done"?"완료":"오류"} (${Math.round((ev.data.ms||0)/1000)}초)`);
      }
    }
  } catch (e) { add("hdr", "■ 연결 오류: " + e); }
  running = false;
  document.querySelectorAll(".skill").forEach(b=>b.disabled=false);
  loadLogs(); loadReport();
}

// ── 로그 ──
async function loadLogs() {
  const runs = await (await fetch("/api/runs")).json();
  $("#logList").innerHTML = runs.length ? runs.map(r => `
    <div class="log" data-id="${r.id}">
      <div class="top"><b>${esc(r.label)}</b>${statusPill(r.status)}<span class="when">${fmt(r.startedAt)}${r.endedAt?` · ${Math.round((r.endedAt-r.startedAt)/1000)}초`:""}</span></div>
      <div class="detail"><div class="empty">불러오는 중…</div></div>
    </div>`).join("") : '<div class="empty">아직 실행 이력이 없습니다 — 스킬 탭에서 버튼을 눌러보세요.</div>';
  document.querySelectorAll(".log").forEach(el => el.onclick = async () => {
    el.classList.toggle("open");
    if (!el.classList.contains("open") || el.dataset.loaded) return;
    el.dataset.loaded = "1";
    const d = await (await fetch("/api/runs/"+el.dataset.id)).json();
    el.querySelector(".detail").innerHTML =
      `<p style="margin-bottom:8px"><b>지시:</b> ${esc(d.prompt)}</p>` +
      `<pre>${esc((d.transcript||[]).map(t=>(t.kind==="tool"?"🔧 ":"")+t.text).join("\n\n")) || "(기록 없음)"}</pre>`;
  });
}

loadReport(); loadSkills();
</script>
</body>
</html>
